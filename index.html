<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>sprint2</title>

    <link rel="stylesheet" href="src/scss/style.scss">
    <script type="module" src="src/js/main.js"></script>
</head>
<body>
    <section class="grid">
        <div class="grid__item">
            <div class="upload">
                <span class="upload__badge">JSON PARSER</span>
                <h1 class="upload__title">Парсер формы</h1>
                <p class="upload__description">
                    Загрузите json файл, чтобы создать форму
                </p>

                <div class="upload__field">
                    <label class="upload__label" for="json">
                        Выберите JSON-файл
                    </label>
                    <input
                        class="upload__input"
                        id="json"
                        type="file"
                        accept=".json"
                    >
                    <span class="upload__hint">Поддерживается только .json</span>
                </div>
            </div>
        </div>
        <div class="grid__item">
            <div class="form-wrapper"></div>
        </div>
    </section>
</body>
</html>
